name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Neither lockfile is usable outside Lovable's sandbox: bun.lock resolves every
      # package through a private registry that 403s externally, and `npm ci` fails on
      # package-lock.json with "Missing: stackback@0.0.2 from lock file". Installing
      # without the lockfile is the one path that resolves cleanly.
      - name: Install dependencies
        run: npm install --no-package-lock --no-audit --no-fund

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
